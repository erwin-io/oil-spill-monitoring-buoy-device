name: Firmware Stage 1 Desktop Checks
on:
  push:
    branches: ["main", "feature/module-d-stage1-foundation"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  desktop-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python modules
        run: python -m compileall -q boot.py main.py config.py app drivers services tests tools
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Run fake-device example (no network)
        run: python tools/simulate.py

  # One-time Project Owner-authorized branch cleanup following PR #1 merge.
  # This job is intentionally removed from main after successful cleanup.
  stage1-branch-cleanup:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: desktop-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete only approved, unchanged Stage 1 branches
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_IDLE_SHA: f8feb3bb16d9d27881646e122746015d5ba1f9a9
        shell: bash
        run: |
          set -euo pipefail

          # Never delete a branch until PR #1 is confirmed merged.
          merged="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1" --jq '.merged')"
          if [[ "$merged" != "true" ]]; then
            echo "PR #1 is not merged; refusing cleanup."
            exit 1
          fi
          merged_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1" --jq '.head.sha')"

          delete_if_unchanged() {
            local branch="$1" expected="$2" current
            current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null || true)"
            if [[ -z "$current" ]]; then
              echo "Already absent: $branch"
            elif [[ "$current" == "$expected" ]]; then
              echo "Removing approved, unchanged branch: $branch"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            else
              echo "::warning::Protected changed branch $branch ($current != $expected)"
            fi
          }

          delete_if_unchanged "feat/module-d-stage1-foundation" "$EXPECTED_IDLE_SHA"
          delete_if_unchanged "feature/module-d-stage1-foundation" "$merged_head"
